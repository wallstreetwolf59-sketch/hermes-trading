[project]
name = "hermes-trading"
version = "0.1.0"
description = "Self-improving paper-trading worker driven by GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "yfinance>=0.2.50",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading"]
