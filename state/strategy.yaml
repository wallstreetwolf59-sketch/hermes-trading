version: "01"
timeframe: "5m"
lookback_candles: 300

# Only trade in the direction of the higher-timeframe trend. This is the
# single biggest fix over naive RSI: it stops the agent buying every dip
# in a downtrend.
trend_filter:
  enabled: true
  fast_ema: 50
  slow_ema: 200

# Entry fires on RSI crossing back UP through the oversold level, not merely
# being below it - waiting for the turn rather than catching the fall.
entry:
  indicator: rsi_reversal
  rsi_period: 14
  threshold: 32
  require_cross_up: true
  direction: long

# Reject signals on dead tape.
#
# volume_mult was 1.15 and it was a design error: it demanded ABOVE-average
# volume on the entry bar, but in a mean-reversion setup volume spikes on the
# selloff and dries up on the bounce we are buying. Backtested over 6 months
# of BTCUSDT it took the strategy from 131 qualifying trades to exactly ZERO.
# Disabled at 0.0 rather than deleted, so the reflection layer can reintroduce
# it deliberately if a future entry style actually wants volume expansion.
confirmation:
  volume_mult: 0.0
  min_atr_pct: 0.08   # skip when ATR is under 0.08% of price - nothing moving

# Stops scale with volatility instead of a fixed percentage, so the same
# strategy behaves sanely in both calm and violent regimes.
risk:
  atr_period: 14
  stop_atr_mult: 1.5
  reward_risk_ratio: 2.0   # target = 2x the stop distance
  position_size_r: 0.5
  max_hold_minutes: 240    # intraday: force flat after 4 hours
  breakeven_at_r: 1.0      # pull stop to entry once +1R in profit
