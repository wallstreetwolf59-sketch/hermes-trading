version: "01"

# Swing, not intraday. Backtesting showed forced daily square-offs dominated
# every exit mix (67 of 81 trades in one run) and stopped trades ever reaching
# their targets. Perpetuals have no session; the daily flat was pure cost.
timeframe: "1h"
lookback_candles: 400

# Only trade with the higher-timeframe trend. This is the one filter that
# measurably helped: it moved average per-trade from -$1.90 to -$0.21.
trend_filter:
  enabled: true
  fast_ema: 50
  slow_ema: 200

# Trend-continuation pullback: wait for a dip to the 20-EMA inside an
# established uptrend, then enter when price closes back above it. This is the
# configuration that was actually backtested (64 trades, 34.4% win rate,
# -0.141R expectancy) - deployed because it is what was measured, not because
# it is profitable. It is not.
entry:
  indicator: ema_pullback
  pullback_ema: 20
  direction: long
  # Retained for the rsi_reversal entry style, which reflection may switch to.
  rsi_period: 14
  threshold: 32
  require_cross_up: true

# volume_mult stays 0.0 - see README. At 1.15 it demanded rising volume on a
# bounce bar and took the strategy to zero trades.
confirmation:
  volume_mult: 0.0
  min_atr_pct: 0.08

risk:
  atr_period: 14
  stop_atr_mult: 1.5
  reward_risk_ratio: 1.5
  position_size_r: 0.5
  max_hold_minutes: 4320   # 3 days
  breakeven_at_r: 1.0
